apiVersion: v1
kind: Pod
metadata:
  name: terminal-sandbox
  namespace: aether-sandboxes
  labels:
    app: aether-sandbox
    sandbox-type: terminal
spec:
  restartPolicy: Never
  containers:
  - name: workspace
    image: onsite48/sandbox-terminal:phase2
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "2"
        memory: "2Gi"
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      runAsUser: 10001
    volumeMounts:
    - name: workspace
      mountPath: /workspace
  volumes:
  - name: workspace
    emptyDir:
      sizeLimit: 2Gi
