x-default-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          memory: 256M
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onsite48}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-onsite48}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [onsite48_network]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 128M
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [onsite48_network]

  centrifugo:
    image: centrifugo/centrifugo:v6.9
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          memory: 64M
    command: ["centrifugo", "--config", "/etc/centrifugo/config.json"]
    volumes:
      - ./centrifugo/config.json:/etc/centrifugo/config.json:ro
    expose: ["8001"]
    depends_on:
      redis:
        condition: service_healthy
    networks: [onsite48_network]

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 256M
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: 9411
      QUERY_BASE_PATH: /
      JAEGER_AGENT_PORT: 6831
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    ports:
      - "16686:16686"
    depends_on:
      redis:
        condition: service_healthy
    networks: [onsite48_network]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          memory: 256M
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The hardened Qdrant image ships no curl and no wget, so the probe
      # opens the socket with bash and writes the request to it. /readyz
      # (rather than /healthz) is what actually gates startup: it only returns
      # 200 once every shard has finished loading, which is the point at which
      # the memory initializer can talk to it.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [onsite48_network]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
        reservations:
          memory: 512M
    expose: ["8000"]
    env_file: .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_NAME: Onsite48
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL to your public app origin}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to your public app origin}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-onsite48}
      POSTGRES_USER: ${POSTGRES_USER:-onsite48}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-onsite48}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-onsite48}
      REDIS_URL: redis://redis:6379/0
      USE_REDIS_WS_REGISTRY: "true"
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      KIMI_API_KEY: ${KIMI_API_KEY:?Set KIMI_API_KEY in .env}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.moonshot.ai/v1}
      KIMI_MODEL: ${KIMI_MODEL:-kimi-k2.6}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY in .env}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:?Set NVIDIA_API_KEY in .env}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-moonshotai/kimi-k3}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      SYNTHAI_PLANNING_PROVIDER: ${SYNTHAI_PLANNING_PROVIDER:-nvidia}
      SYNTHAI_VERIFICATION_PROVIDER: ${SYNTHAI_VERIFICATION_PROVIDER:-kimi}
      SYNTHAI_FAST_PROVIDER: ${SYNTHAI_FAST_PROVIDER:-deepseek}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CONNECTOR_ENCRYPTION_KEY: ${CONNECTOR_ENCRYPTION_KEY:?Set CONNECTOR_ENCRYPTION_KEY in .env}
      # Docker Desktop's public local endpoint is http://localhost. A Secure
      # refresh cookie is never sent over HTTP, so local session recovery would
      # otherwise fail after the short-lived access token expires. Set
      # COOKIE_SECURE=true for every HTTPS deployment.
      #
      # This is required rather than defaulted because ENVIRONMENT above
      # defaults to production, and a deployed environment now refuses to boot
      # with COOKIE_SECURE=false or a non-https CORS origin
      # (app/core/config.py::_validate_tls_transport). Requiring it here makes
      # `docker compose up` name the missing variable, instead of the app
      # starting and then dying with a less obvious message. For local Docker
      # Desktop over http, set COOKIE_SECURE=false and ENVIRONMENT=development.
      #
      # This is required rather than defaulted because ENVIRONMENT above
      # defaults to production, and a deployed environment now refuses to boot
      # with COOKIE_SECURE=false or a non-https CORS origin
      # (app/core/config.py::_validate_tls_transport). Requiring it here makes
      # `docker compose up` name the missing variable, instead of the app
      # starting and then dying with a less obvious message. For local Docker
      # Desktop over http, set COOKIE_SECURE=false and ENVIRONMENT=development.
      COOKIE_SECURE: "${COOKIE_SECURE:?Set COOKIE_SECURE in .env: true for HTTPS deployments, false only for local http development}"
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-false}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-docker}
      RUN_MIGRATIONS: "true"
      # One-time compatibility recovery for databases created by the original
      # metadata bootstrap without a recorded Alembic revision. It is a no-op
      # for normally versioned databases and never runs in the worker.
      LEGACY_SCHEMA_RECOVERY: "true"
      RUN_PROACTIVE_WORKER: "false"
      AUTO_CREATE_SCHEMA: "false"
      # Existing attachments live within the persistent onsite48_kuzu volume.
      # Keep this path stable so an upgrade never hides prior user files.
      ATTACHMENT_STORAGE_ROOT: /tmp/onsite48/uploads
      # Observability: OpenTelemetry + Jaeger + Centrifugo
      OTEL_TRACES_EXPORTER: "jaeger"
      OTEL_SERVICE_NAME: "onsite48-api"
      JAEGER_HOST: "jaeger"
      JAEGER_PORT: "6831"
      JAEGER_ENDPOINT: "http://jaeger:14268/api/traces"
      CENTRIFUGO_URL: "http://centrifugo:8001"
      CENTRIFUGO_SECRET: "${CENTRIFUGO_SECRET:-dev-secret-please-change}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      centrifugo:
        condition: service_started
      qdrant:
        # Wait for /readyz rather than just the process. "service_started"
        # let the memory initializer race a Qdrant that had not finished
        # loading its shards, which surfaced as a startup-time memory
        # failure that looked like a configuration problem.
        condition: service_healthy
    volumes:
      - onsite48_kuzu:/tmp/onsite48
      - onsite48_sandbox:/tmp/onsite48/sandbox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 120s
    networks: [onsite48_network]

  proactive-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *default-logging
    command: ["python", "-m", "app.services.proactive_worker_entrypoint"]
    env_file: .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-onsite48}
      POSTGRES_USER: ${POSTGRES_USER:-onsite48}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-onsite48}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-onsite48}
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "false"
      AUTO_CREATE_SCHEMA: "false"
      PROACTIVE_WORKER_POLL_SECONDS: ${PROACTIVE_WORKER_POLL_SECONDS:-60}
    # This worker is not an HTTP server. Its scheduler runtime already writes
    # this Redis heartbeat each poll cycle; probe that instead of inheriting
    # the backend image's web-server probe.
    healthcheck:
      test: ['CMD', 'python', '-c', 'from redis import Redis; import sys; heartbeat = Redis.from_url("redis://redis:6379/0").get("onsite48:proactive_worker:heartbeat"); sys.exit(0 if heartbeat else 1)']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The worker never runs Alembic itself. Wait until the backend has
      # completed guarded recovery/migrations and passed its API health check.
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          memory: 192M
    networks: [onsite48_network]

  task-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *default-logging
    command: ["python", "-m", "app.services.task_worker_entrypoint"]
    env_file: .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-onsite48}
      POSTGRES_USER: ${POSTGRES_USER:-onsite48}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-onsite48}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-onsite48}
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      RUN_MIGRATIONS: "false"
      AUTO_CREATE_SCHEMA: "false"
      WORKER_BATCH: ${WORKER_BATCH:-3}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', 'from redis import Redis; import sys; heartbeat = Redis.from_url("redis://redis:6379/0").get("onsite48:proactive_worker:heartbeat"); sys.exit(0 if heartbeat else 1)']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      replicas: ${TASK_WORKER_REPLICAS:-1}
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
        reservations:
          memory: 512M
    networks: [onsite48_network]

  frontend:
    build: ./frontend
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          memory: 128M
    expose: ["3000"]
    environment:
      NODE_ENV: production
      DOCKER_ENV: "true"
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 20s
      timeout: 5s
      retries: 6
    networks: [onsite48_network]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [onsite48_network]

networks:
  onsite48_network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  onsite48_sandbox:
  onsite48_kuzu: