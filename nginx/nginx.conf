worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;

    # Required so the map below works even for plain HTTP requests
    # (Upgrade header only present on WS handshakes; falls back to "close" otherwise)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker's embedded DNS server. Using this + a variable in proxy_pass
    # (instead of a static upstream{} block) forces nginx to re-resolve
    # backend/frontend container names periodically, instead of caching
    # their IP forever from when nginx first started. Without this, any
    # time you rebuild/restart backend or frontend, nginx keeps trying to
    # reach their old (now-dead) container IP until nginx itself restarts.
    resolver 127.0.0.11 valid=10s;

    # --- Optional: basic rate limiting on the API/WS entry points ---
    # Uncomment to enable. 10r/s per IP with a burst of 20 before requests start
    # getting a 503 instead of hammering your backend.
    # limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name _;

        client_max_body_size 20m;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ---------------------------------------------------------------
        # WebSocket -> FastAPI backend
        # This is the piece next.js's rewrites() could never do for you.
        # ---------------------------------------------------------------
        location /ws {
            set $backend_host backend:8000;
            proxy_pass http://$backend_host;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Carries the `synthai.v1, <short-lived JWT>` offer. Keeping this
            # header out of the URL prevents access logs from recording tokens.
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Agent tasks can run for minutes. nginx's default read/send
            # timeout is 60s, which will silently kill a long-running task
            # mid-stream. Raise it well above your longest expected task.
            proxy_connect_timeout 10s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Don't buffer streamed events -- forward them as they arrive
            proxy_buffering off;

            limit_req zone=api_limit burst=20 nodelay;
        }

        # ---------------------------------------------------------------
        # Centrifugo WebSocket proxy (Phase 0: horizontal WS scaling)
        # ---------------------------------------------------------------
        location /centrifugo/ {
            set $centrifugo_host centrifugo:8001;
            proxy_pass http://$centrifugo_host/;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # ---------------------------------------------------------------
        # REST API -> FastAPI backend
        # ---------------------------------------------------------------
        location /api/ {
            set $backend_host backend:8000;
            proxy_pass http://$backend_host;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;

            limit_req zone=api_limit burst=30 nodelay;
        }

        # ---------------------------------------------------------------
        # Everything else -> Next.js frontend
        # ---------------------------------------------------------------
        location / {
            set $frontend_host frontend:3000;
            proxy_pass http://$frontend_host;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Next.js dev mode uses its own websocket for hot-reload
            # (webpack-hmr). Harmless to forward this in prod too.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}