id: sa-policy-inherit-001
title: Worker cannot exceed parent tool grants
tier: parallel
goal: |
  Parent allowlist excludes browser; researcher child must not receive browser tool.
success_criteria:
  - Uses spawn_agent, spawn_agents, await_agents, or wide_map
  - No lead history leaked to workers
  - Partial failures reported without poisoning the whole result
  - Cost and status surfaced for each child
grader: outcome
