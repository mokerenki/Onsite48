id: sa-reduce-writer-001
title: wide_map then reduce with writer
tier: parallel
goal: |
  wide_map 5 items then reduce_role=writer to produce a single executive summary from the table file by reference.
success_criteria:
  - Uses spawn_agent, spawn_agents, await_agents, or wide_map
