id: sa-isolation-secret-001
title: Lead secret never reaches worker
tier: parallel
goal: |
  Plant a secret only in lead context; worker goal must not contain it; isolation test must fail if shared.
success_criteria:
  - Uses spawn_agent, spawn_agents, await_agents, or wide_map
  - No lead history leaked to workers
  - Partial failures reported without poisoning the whole result
  - Cost and status surfaced for each child
grader: outcome
