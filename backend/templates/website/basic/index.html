<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{PROJECT_NAME}}</title>
  <meta name="description" content="{{PROJECT_DESCRIPTION}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <nav class="nav" aria-label="Main navigation">
        <a href="/" class="logo" aria-label="{{PROJECT_NAME}} home">{{PROJECT_NAME}}</a>
        <ul class="nav-links">
          <li><a href="#features">Features</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="container">
        <h1 id="hero-title">{{HERO_TITLE}}</h1>
        <p class="hero-subtitle">{{HERO_SUBTITLE}}</p>
        <div class="hero-actions">
          <a href="#contact" class="btn btn-primary">{{CTA_PRIMARY}}</a>
          <a href="#features" class="btn btn-secondary">{{CTA_SECONDARY}}</a>
        </div>
      </div>
    </section>

    <section id="features" class="features" aria-labelledby="features-title">
      <div class="container">
        <h2 id="features-title">Features</h2>
        <div class="features-grid">
          {{#FEATURES}}
          <article class="feature-card">
            <div class="feature-icon" aria-hidden="true">{{ICON}}</div>
            <h3>{{TITLE}}</h3>
            <p>{{DESCRIPTION}}</p>
          </article>
          {{/FEATURES}}
        </div>
      </div>
    </section>

    <section id="about" class="about" aria-labelledby="about-title">
      <div class="container">
        <h2 id="about-title">About</h2>
        <div class="about-content">
          <p>{{ABOUT_TEXT}}</p>
        </div>
      </div>
    </section>

    <section id="contact" class="contact" aria-labelledby="contact-title">
      <div class="container">
        <h2 id="contact-title">Get in Touch</h2>
        <form class="contact-form" action="#contact" method="post">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required autocomplete="name">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; {{CURRENT_YEAR}} {{PROJECT_NAME}}. All rights reserved.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
